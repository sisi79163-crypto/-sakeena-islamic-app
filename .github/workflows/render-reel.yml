name: Render Instagram reel

on:
  push:
    branches: ["claude/remotion-code-plugin-0npveu"]
    paths: ["reel/**", ".github/workflows/render-reel.yml", "!reel/output/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reel
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare clips
        run: python3 scripts/prepare.py
      - name: Install Remotion
        run: npm install --no-audit --no-fund
      - name: Render
        run: npm run render
      - name: Upload reel
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: reel/output/reel.mp4
      - name: Commit reel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -f output/reel.mp4
          git commit -m "Render Instagram reel [skip ci]"
          git push
